<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Roboto+Flex:wght@300;400;500;600;700;800&family=Roboto+Mono:wght@500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
            rel="stylesheet"
        />
        <link href="/src/input.css" rel="stylesheet" />
    </head>

    <body class="min-h-screen flex flex-col justify-between selection:bg-[var(--md-sys-color-primary-container)] selection:text-[var(--md-sys-color-on-primary-container)]">
        <!-- Main Workspace -->
        <main
            id="main-content"
            class="flex-1 flex flex-col justify-center items-center w-full mx-auto px-2 py-16"
        >
            <!-- Category Navigator Tabs (injected via renderCategoryTabs) -->
            <div class="w-full max-w-4xl mb-4 flex items-center justify-center">
                <div
                    id="category-tabs"
                    class="flex items-center gap-2.5 overflow-x-auto hide-scrollbar py-1"
                ></div>
            </div>

            <!-- Snap-Scrolling Workspace Panels -->
            <section id="workspace-container" class="w-full mb-20 flex justify-center">
                <div id="workstrip" class="workstrip hide-scrollbar">
                    <!-- injected via renderWorkspace -->
                </div>
            </section>
        </main>

        <!-- Transient Keyboard Breadcrumb HUD -->
        <div id="keyboard-hud" class="m3-key-hud"></div>
