<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Roboto+Flex:wght@300;400;500;600;700;800&family=Roboto+Mono:wght@500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
            rel="stylesheet"
        />
        <link href="/src/input.css" rel="stylesheet" />
    </head>

    <body class="min-h-screen flex flex-col justify-between selection:bg-[var(--md-sys-color-primary-container)] selection:text-[var(--md-sys-color-on-primary-container)]">
        <!-- Main Workspace -->
        <main
            id="main-content"
            class="flex-1 flex flex-col justify-center items-center w-full mx-auto px-2 py-16"
        >
            <!-- Omni Search Bar & Live Suggestions -->
            <section id="section-search" class="w-full max-w-lg px-4 mx-auto mb-5">
                <form
                    id="search-form"
                    class="m3-search-bar flex items-center w-full px-3.5 py-2.5 gap-2.5"
                >
                    <!-- Engine Picker Button -->
                    <div class="relative flex items-center shrink-0">
                        <button
                            type="button"
                            id="dropdown-btn"
                            class="flex items-center gap-1.5 bg-[var(--md-sys-color-surface-container-highest)] hover:bg-[var(--md-sys-color-surface-container)] px-3.5 py-1.5 rounded-diag text-xs font-semibold text-[var(--md-sys-color-primary)] transition-colors cursor-pointer"
                        >
                            <span id="selected-engine-text">Google</span>
                            <span class="material-symbols-outlined text-[14px]">arrow_drop_down</span>
                        </button>

                        <!-- Engine Picker Dropdown Menu -->
                        <div
                            id="dropdown-menu"
                            class="m3-attached-menu absolute left-0 top-full mt-1.5 w-48 hidden"
                        >
                            <button
                                type="button"
                                class="m3-menu-item engine-option"
                                data-value="https://www.google.com/search?q="
                                data-name="Google"
                            >
                                <span>Google</span>
                                <span class="m3-key-badge text-[9px]">:g</span>
                            </button>
                            <button
                                type="button"
                                class="m3-menu-item engine-option"
                                data-value="https://duckduckgo.com/?q="
                                data-name="DuckDuckGo"
                            >
                                <span>DuckDuckGo</span>
                                <span class="m3-key-badge text-[9px]">:d</span>
                            </button>
                            <button
                                type="button"
                                class="m3-menu-item engine-option"
                                data-value="https://www.youtube.com/results?search_query="
                                data-name="YouTube"
                            >
                                <span>YouTube</span>
                                <span class="m3-key-badge text-[9px]">:y</span>
                            </button>
                            <button
                                type="button"
                                class="m3-menu-item engine-option"
                                data-value="https://www.reddit.com/search/?q="
                                data-name="Reddit"
                            >
                                <span>Reddit</span>
                                <span class="m3-key-badge text-[9px]">:r</span>
                            </button>
                            <button
                                type="button"
                                class="m3-menu-item engine-option"
                                data-value="https://github.com/search?q="
                                data-name="GitHub"
                            >
                                <span>GitHub</span>
                                <span class="m3-key-badge text-[9px]">:gh</span>
                            </button>
                        </div>
                    </div>

                    <input
                        type="hidden"
                        id="search-engine-value"
                        value="https://www.google.com/search?q="
                    />

                    <!-- Search Input Field -->
                    <div class="flex-1 flex items-center gap-2 px-1">
                        <input
                            type="text"
                            id="search-input"
                            placeholder="Search"
                            autocomplete="off"
                            class="bg-transparent w-full outline-none text-sm text-[var(--md-sys-color-on-surface)] placeholder-[var(--md-sys-color-outline)]"
                        />
                    </div>
                    <span class="material-symbols-outlined text-[18px] text-[var(--md-sys-color-outline)] mr-1 pointer-events-none select-none">
                        search
                    </span>
                </form>
            <!-- Category Navigator Tabs (injected via renderCategoryTabs) -->
            <div class="w-full max-w-4xl mb-4 flex items-center justify-center">
                <div
                    id="category-tabs"
                    class="flex items-center gap-2.5 overflow-x-auto hide-scrollbar py-1"
                ></div>
            </div>

            <!-- Snap-Scrolling Workspace Panels -->
            <section id="workspace-container" class="w-full mb-20 flex justify-center">
                <div id="workstrip" class="workstrip hide-scrollbar">
                    <!-- injected via renderWorkspace -->
                </div>
            </section>
        </main>

        <!-- Transient Keyboard Breadcrumb HUD -->
        <div id="keyboard-hud" class="m3-key-hud"></div>
